<div class="card shadow-sm border-0">
  <div class="card-body">
    <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-3">
      <div>
        <h2 class="h4 mb-1">Task list</h2>
        <p class="text-muted mb-0">Search, filter, and sort tasks from the Laravel API.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <input class="form-control" placeholder="Search tasks" ng-model="filters.search" ng-change="loadTasks()">
        <select class="form-select" ng-model="filters.status" ng-change="loadTasks()">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="in_progress">In progress</option>
          <option value="completed">Completed</option>
        </select>
        <select class="form-select" ng-model="filters.priority" ng-change="loadTasks()">
          <option value="">All priorities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <select class="form-select" ng-model="filters.sort_by" ng-change="loadTasks()">
          <option value="updated_at">Updated</option>
          <option value="due_at">Due</option>
          <option value="title">Title</option>
          <option value="priority">Priority</option>
        </select>
        <select class="form-select" ng-model="filters.sort_direction" ng-change="loadTasks()">
          <option value="desc">Descending</option>
          <option value="asc">Ascending</option>
        </select>
      </div>
    </div>

    <div class="text-center py-4" ng-if="loading">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="table-responsive" ng-if="!loading">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Due</th>
            <th>Updated</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="task in tasks">
            <td><a ng-href="#/tasks/{{ task.id }}">{{ task.title }}</a></td>
            <td>{{ task.status }}</td>
            <td>{{ task.priority }}</td>
            <td>{{ task.due_at | date:'mediumDate' }}</td>
            <td>{{ task.updated_at | date:'mediumDate' }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <nav class="mt-3" ng-if="pagination.last_page > 1">
      <ul class="pagination justify-content-center">
        <li class="page-item" ng-class="{disabled: filters.page === 1}">
          <a class="page-link" href="#" ng-click="changePage(filters.page - 1)">Previous</a>
        </li>
        <li class="page-item" ng-repeat="page in [] | range:pagination.last_page" ng-class="{active: filters.page === $index + 1}">
          <a class="page-link" href="#" ng-click="changePage($index + 1)">{{ $index + 1 }}</a>
        </li>
        <li class="page-item" ng-class="{disabled: filters.page === pagination.last_page}">
          <a class="page-link" href="#" ng-click="changePage(filters.page + 1)">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
