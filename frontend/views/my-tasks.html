<div class="card shadow-sm border-0">
  <div class="card-body">
    <h2 class="h4 mb-3">My tasks</h2>
    <div class="text-center py-4" ng-if="loading">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
    <div class="table-responsive" ng-if="!loading">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Due</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="task in tasks">
            <td><a ng-href="#/tasks/{{ task.id }}">{{ task.title }}</a></td>
            <td>{{ task.status }}</td>
            <td>{{ task.priority }}</td>
            <td>{{ task.due_at | date:'mediumDate' }}</td>
          </tr>
          <tr ng-if="!tasks.length">
            <td colspan="4" class="text-muted">No tasks are assigned to you yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
