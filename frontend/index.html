<!DOCTYPE html>
<html lang="en" ng-app="taskApp">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
  </head>
  <body ng-cloak>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="#/dashboard">TaskFlow</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav" aria-controls="topNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="topNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0" ng-if="isAuthenticated()">
            <li class="nav-item"><a class="nav-link" href="#/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="#/tasks">Tasks</a></li>
            <li class="nav-item"><a class="nav-link" href="#/my-tasks">My Tasks</a></li>
            <li class="nav-item"><a class="nav-link" href="#/assignment-history">History</a></li>
          </ul>
          <ul class="navbar-nav ms-auto" ng-if="isAuthenticated()">
            <li class="nav-item me-2"><span class="navbar-text text-light">{{ currentUser.name || 'User' }}</span></li>
            <li class="nav-item"><a class="nav-link" href="#" ng-click="logout()">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="alert alert-danger" ng-if="globalError">{{ globalError }}</div>
      <div ng-view></div>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
